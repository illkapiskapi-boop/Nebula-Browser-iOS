name: Build Nebula Browser for iOS Simulator

on:
  workflow_dispatch:
  push:
    paths:
      - 'NebulaBrowser/**'
      - 'NebulaBrowser.xcodeproj/**'
      - 'build-ios-mac.sh'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Simulator app
        run: ./build-ios-mac.sh </dev/null

      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: NebulaBrowser-iOS-Simulator-App
          path: build/Build/Products/Debug-iphonesimulator/NebulaBrowser.app
          if-no-files-found: error
          retention-days: 14
