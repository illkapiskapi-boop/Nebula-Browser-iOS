name: Build Nebula Browser for iPhone (unsigned IPA)

on:
  workflow_dispatch:
  push:
    paths:
      - 'NebulaBrowser/**'
      - 'NebulaBrowser.xcodeproj/**'
      - '.github/workflows/ios-device-ipa.yml'

permissions:
  contents: read

jobs:
  build-device-ipa:
    name: Build unsigned iPhone IPA for personal signing
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for real iOS devices (not Simulator)
        run: |
          set -euo pipefail
          xcodebuild \
            -project NebulaBrowser.xcodeproj \
            -scheme NebulaBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/NebulaBrowser.app'
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/NebulaBrowser.app
          (cd build/ipa && /usr/bin/zip -qry NebulaBrowser-Unsigned-iOS.ipa Payload)
          test -s build/ipa/NebulaBrowser-Unsigned-iOS.ipa
          /usr/bin/unzip -l build/ipa/NebulaBrowser-Unsigned-iOS.ipa | head -40

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: NebulaBrowser-iOS-Unsigned-IPA
          path: build/ipa/NebulaBrowser-Unsigned-iOS.ipa
          if-no-files-found: error
          retention-days: 14
