# Nebula Browser iOS - robust device IPA workflow
# Handles both a correctly structured repository and files flattened by GitHub's web uploader.
name: Build Nebula Browser for iPhone (unsigned IPA)

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-device-ipa.yml'
      - 'NebulaBrowser/**'
      - 'NebulaBrowser.xcodeproj/**'
      - 'project.pbxproj'
      - '*.swift'
      - '*.plist'
      - '*.storyboard'
      - '*.png'
      - 'Assets.xcassets/**'

permissions:
  contents: read

jobs:
  build-device-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks

      - name: Repair and validate project layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import sys

          root = Path.cwd()
          project_dir = root / "NebulaBrowser.xcodeproj"
          source_dir = root / "NebulaBrowser"
          scheme_dir = project_dir / "xcshareddata" / "xcschemes"
          required_sources = [
              "AppDelegate.swift",
              "SceneDelegate.swift",
              "BrowserDataStore.swift",
              "BrowserViewController.swift",
              "LibraryViewController.swift",
              "SettingsViewController.swift",
              "Info.plist",
              "LaunchScreen.storyboard",
              "PrivacyInfo.xcprivacy",
          ]

          def is_ignored(path: Path) -> bool:
              return any(part in {".git", "build", "DerivedData"} for part in path.parts)

          def locate(name: str, preferred: Path):
              if preferred.exists():
                  return preferred
              matches = [p for p in root.rglob(name) if not is_ignored(p.relative_to(root))]
              if not matches:
                  return None
              matches.sort(key=lambda p: (len(p.relative_to(root).parts), str(p)))
              return matches[0]

          print("[INFO] Preparing the Xcode project layout...")

          # Re-create the .xcodeproj bundle if the web uploader flattened it.
          if not project_dir.is_dir():
              if project_dir.exists():
                  raise SystemExit("[ERROR] NebulaBrowser.xcodeproj exists but is not a directory.")
              pbx_source = locate("project.pbxproj", root / "project.pbxproj")
              if pbx_source is None:
                  raise SystemExit("[ERROR] project.pbxproj was not found in the repository.")
              project_dir.mkdir(parents=True, exist_ok=True)
              destination = project_dir / "project.pbxproj"
              if pbx_source != destination:
                  shutil.move(str(pbx_source), str(destination))

          project_file = project_dir / "project.pbxproj"
          if not project_file.is_file():
              pbx_source = locate("project.pbxproj", root / "project.pbxproj")
              if pbx_source is None:
                  raise SystemExit("[ERROR] NebulaBrowser.xcodeproj/project.pbxproj is missing.")
