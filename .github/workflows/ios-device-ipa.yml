name: Build Nebula Browser for iPhone (unsigned IPA)

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-device-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Repair and validate uploaded project layout
        shell: bash
        run: |
          set -euo pipefail
          echo 'Preparing the Xcode project from the files uploaded to the repository root...'

          # GitHub's web uploader previously placed the contents of the
          # .xcodeproj bundle and the app source files directly in the repo root.
          # Re-create the bundle and source-folder layout expected by the project.
          if [[ ! -d NebulaBrowser.xcodeproj ]]; then
            if [[ -f project.pbxproj ]]; then
              mkdir -p NebulaBrowser.xcodeproj/xcshareddata/xcschemes
              mv project.pbxproj NebulaBrowser.xcodeproj/project.pbxproj
            else
              echo '::error::Cannot find NebulaBrowser.xcodeproj or root project.pbxproj.'
              ls -la
              exit 1
            fi
          fi

          mkdir -p NebulaBrowser.xcodeproj/xcshareddata/xcschemes
          if [[ -f NebulaBrowser.xcscheme && ! -f NebulaBrowser.xcodeproj/xcshareddata/xcschemes/NebulaBrowser.xcscheme ]]; then
            mv NebulaBrowser.xcscheme NebulaBrowser.xcodeproj/xcshareddata/xcschemes/NebulaBrowser.xcscheme
          fi

          mkdir -p NebulaBrowser
          for file in \
            AppDelegate.swift \
            SceneDelegate.swift \
            BrowserDataStore.swift \
            BrowserViewController.swift \
            LibraryViewController.swift \
            SettingsViewController.swift \
            Info.plist \
            LaunchScreen.storyboard \
            PrivacyInfo.xcprivacy; do
            if [[ -f "$file" && ! -f "NebulaBrowser/$file" ]]; then
              mv "$file" "NebulaBrowser/$file"
            fi
          done

          mkdir -p NebulaBrowser/Assets.xcassets
          if [[ -d Assets.xcassets && ! -d NebulaBrowser/Assets.xcassets/NebulaMark.imageset ]]; then
            cp -R Assets.xcassets/. NebulaBrowser/Assets.xcassets/
          fi

          mkdir -p NebulaBrowser/Assets.xcassets/NebulaMark.imageset
          mkdir -p NebulaBrowser/Assets.xcassets/AppIcon.appiconset

          if [[ -f NebulaMark.png && ! -f NebulaBrowser/Assets.xcassets/NebulaMark.imageset/NebulaMark.png ]]; then
            mv NebulaMark.png NebulaBrowser/Assets.xcassets/NebulaMark.imageset/NebulaMark.png
          fi
          if [[ -f Contents.json && ! -f NebulaBrowser/Assets.xcassets/NebulaMark.imageset/Contents.json ]]; then
            mv Contents.json NebulaBrowser/Assets.xcassets/NebulaMark.imageset/Contents.json
          fi
          if [[ -f AppIcon.png && ! -f NebulaBrowser/Assets.xcassets/AppIcon.appiconset/AppIcon.png ]]; then
            mv AppIcon.png NebulaBrowser/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          fi

          if [[ ! -f NebulaBrowser/Assets.xcassets/Contents.json ]]; then
            printf '%s\n' '{"info":{"author":"xcode","version":1}}' > NebulaBrowser/Assets.xcassets/Contents.json
          fi
          if [[ ! -f NebulaBrowser/Assets.xcassets/NebulaMark.imageset/Contents.json ]]; then
            printf '%s\n' '{"images":[{"filename":"NebulaMark.png","idiom":"universal"}],"info":{"author":"xcode","version":1}}' > NebulaBrowser/Assets.xcassets/NebulaMark.imageset/Contents.json
          fi
          if [[ -f NebulaBrowser/Assets.xcassets/AppIcon.appiconset/AppIcon.png && ! -f NebulaBrowser/Assets.xcassets/AppIcon.appiconset/Contents.json ]]; then
            printf '%s\n' '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > NebulaBrowser/Assets.xcassets/AppIcon.appiconset/Contents.json
          fi

          echo '--- Prepared repository files ---'
          find NebulaBrowser.xcodeproj NebulaBrowser -maxdepth 5 -print | sort

          test -f NebulaBrowser.xcodeproj/project.pbxproj || { echo '::error::Missing project.pbxproj'; exit 1; }
          test -f NebulaBrowser.xcodeproj/xcshareddata/xcschemes/NebulaBrowser.xcscheme || { echo '::error::Missing shared NebulaBrowser scheme'; exit 1; }
          test -f NebulaBrowser/BrowserViewController.swift || { echo '::error::Missing BrowserViewController.swift'; exit 1; }
